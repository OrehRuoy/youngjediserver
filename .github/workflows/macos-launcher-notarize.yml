name: macOS launcher notarize

# Manual only. macOS minutes cost 10×.
# Exports the launcher, signs it with the Developer ID certificate, notarizes it,
# and uploads Young Jedi Launchermac.zip for itch.io.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notarize:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.6.3"
      APPLE_TEAM_ID: "9WRNQYQZTB"
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and macOS export templates
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          GODOT_BIN="$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot"
          test -x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp "$RUNNER_TEMP/templates/macos.zip" "$TEMPLATE_DIR/macos.zip"
          test -f "$TEMPLATE_DIR/macos.zip"

      - name: Import Developer ID certificate
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$APPLE_DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning build.keychain
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Export, sign, and notarize
        env:
          APPLE_ID_USERNAME: ${{ secrets.APPLE_ID_USERNAME }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          "$GODOT_BIN" --headless --path launcher --import || true
          "$GODOT_BIN" --headless --path launcher --export-release "macOS" "$RUNNER_TEMP/launcher-export.zip"
          test -f "$RUNNER_TEMP/launcher-export.zip"
          unzip -q "$RUNNER_TEMP/launcher-export.zip" -d "$RUNNER_TEMP/launcher-app"
          APP=$(find "$RUNNER_TEMP/launcher-app" -name "*.app" -maxdepth 3 -print -quit)
          test -n "$APP"
          echo "App bundle: $APP"

          IDENTITY=$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          test -n "$IDENTITY"
          echo "Signing as: $IDENTITY"
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" --keychain build.keychain "$APP"
          codesign --verify --strict --verbose=2 "$APP"

          SUBMIT_ZIP="$RUNNER_TEMP/launcher-notarize.zip"
          ditto -c -k --keepParent "$APP" "$SUBMIT_ZIP"
          xcrun notarytool submit "$SUBMIT_ZIP" \
            --apple-id "$APPLE_ID_USERNAME" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          ditto -c -k --keepParent "$APP" "dist/Young Jedi Launchermac.zip"
          ls -la "dist/Young Jedi Launchermac.zip"

      - name: Upload notarized launcher
        uses: actions/upload-artifact@v4
        with:
          name: Young-Jedi-Launchermac
          path: dist/Young Jedi Launchermac.zip
          retention-days: 14
